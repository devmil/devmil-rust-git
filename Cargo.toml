[package]
name = "devmil-git"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/devmil/devmil-rust-git"
description = "Observable Git repository models, cached loading, integrations, and bounded execution"

[features]
default = []
hosting = ["dep:serde"]
# Theme-independent syntax categories for Git diff sources (syntect + two-face, Oniguruma).
syntax-highlighting = ["dep:syntect", "dep:two-face"]

[dependencies]
zeroize = "=1.8.2"
notify = "=8.2.0"
sha2 = "=0.10.9"
serde_json = "=1.0.145"
serde = { version = "=1.0.229", features = ["derive"], optional = true }
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rustix = { version = "=1.1.4", features = ["process", "fs"] }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-onig"], optional = true }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-onig"], optional = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
